openapi: 3.0.3
info:
  title: GymTracker API
  version: 1.0.0
  description: API de entrenamientos. Usuarios con aprobación de un administrador, planes y sesiones.
servers:
  - url: http://127.0.0.1:8081
security:
  - bearer: []
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    id: {name: id, in: path, required: true, schema: {type: string}, example: 00000000-0000-0000-0000-000000000000}
    planId: {name: planId, in: path, required: true, schema: {type: string}, example: 00000000-0000-0000-0000-000000000000}
    routineId: {name: routineId, in: path, required: true, schema: {type: string}, example: 00000000-0000-0000-0000-000000000000}
    exerciseId: {name: exerciseId, in: path, required: true, schema: {type: string}, example: 00000000-0000-0000-0000-000000000000}
    sessionId: {name: sessionId, in: path, required: true, schema: {type: string}, example: 00000000-0000-0000-0000-000000000000}
  schemas:
    Name:
      type: object
      required: [name]
      properties:
        name: {type: string, example: Fuerza}
    Credentials:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email, example: dast@example.com}
        password: {type: string, minLength: 8, example: dast-password}
    Registration:
      allOf:
        - $ref: '#/components/schemas/Credentials'
        - $ref: '#/components/schemas/Name'
    Exercise:
      type: object
      required: [name]
      properties:
        name: {type: string, example: Press banca}
        sets: {type: integer, example: 4}
        reps: {type: integer, example: 8}
        weight: {type: number, example: 60}
        notes: {type: string, example: Barra}
    Session:
      type: object
      required: [routine_id, routine_name, exercises]
      properties:
        plan_id: {type: string, example: plan-1}
        routine_id: {type: string, example: routine-1}
        routine_name: {type: string, example: Empuje}
        date: {type: string, example: "2026-11-01"}
        started_at: {type: string, format: date-time, example: "2026-11-01T18:00:00Z"}
        finished_at: {type: string, format: date-time, example: "2026-11-01T19:00:00Z"}
        exercises:
          type: array
          items:
            type: object
            properties:
              exercise_id: {type: string, example: exercise-1}
              name: {type: string, example: Press banca}
              sets:
                type: array
                items:
                  type: object
                  properties:
                    weight: {type: number, example: 60}
                    reps: {type: integer, example: 8}
                    rest_seconds: {type: integer, example: 90}
paths:
  /auth/login:
    post:
      summary: Iniciar sesión
      security: []
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Credentials'}}}}
      responses: {'200': {description: Token}, '400': {description: Datos no válidos}, '401': {description: Credenciales no válidas o cuenta sin aprobar}}
  /users:
    post:
      summary: Registrar una cuenta pendiente de aprobación
      security: []
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Registration'}}}}
      responses: {'201': {description: Creada}, '400': {description: Datos no válidos}, '409': {description: El correo ya existe}}
    get:
      summary: Listar cuentas por estado (admin)
      parameters:
        - {name: status, in: query, required: true, schema: {type: string, enum: [pending, deactivated]}, example: pending}
      responses: {'200': {description: Lista}, '400': {description: Estado no válido}, '403': {description: Sin permiso}}
  /users/{id}:
    parameters: [{$ref: '#/components/parameters/id'}]
    get:
      summary: Ver el perfil propio
      responses: {'200': {description: Perfil}, '403': {description: Sin permiso}, '404': {description: No existe}}
    patch:
      summary: Editar el perfil propio
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Name'}}}}
      responses: {'200': {description: Perfil}, '403': {description: Sin permiso}, '404': {description: No existe}}
    delete:
      summary: Dar de baja una cuenta (dueño o admin)
      responses: {'204': {description: Dada de baja}, '403': {description: Sin permiso}, '404': {description: No existe}, '409': {description: Último admin}}
  /users/{id}/activate:
    parameters: [{$ref: '#/components/parameters/id'}]
    patch:
      summary: Aprobar o reactivar una cuenta (admin)
      responses: {'204': {description: Activada}, '403': {description: Sin permiso}, '404': {description: No existe}}
  /plans:
    post:
      summary: Crear un plan
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Name'}}}}
      responses: {'201': {description: Creado}, '400': {description: Datos no válidos}}
    get:
      summary: Listar planes
      parameters:
        - {name: name, in: query, schema: {type: string}, example: fuerza}
      responses: {'200': {description: Lista}}
  /plans/active:
    get:
      summary: Ver el plan activo
      responses: {'200': {description: Plan}, '404': {description: Sin plan activo}}
  /plans/{planId}:
    parameters: [{$ref: '#/components/parameters/planId'}]
    get:
      summary: Ver un plan
      responses: {'200': {description: Plan}, '404': {description: No existe}}
    patch:
      summary: Renombrar un plan
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Name'}}}}
      responses: {'200': {description: Plan}, '404': {description: No existe}}
    delete:
      summary: Eliminar un plan
      responses: {'204': {description: Eliminado}}
  /plans/{planId}/activate:
    parameters: [{$ref: '#/components/parameters/planId'}]
    patch:
      summary: Activar un plan
      responses: {'204': {description: Activado}, '404': {description: No existe}}
  /plans/{planId}/routines:
    parameters: [{$ref: '#/components/parameters/planId'}]
    post:
      summary: Agregar una rutina
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Name'}}}}
      responses: {'201': {description: Creada}, '404': {description: No existe}}
  /plans/{planId}/routines/{routineId}:
    parameters: [{$ref: '#/components/parameters/planId'}, {$ref: '#/components/parameters/routineId'}]
    patch:
      summary: Renombrar una rutina
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Name'}}}}
      responses: {'200': {description: Rutina}, '404': {description: No existe}}
    delete:
      summary: Eliminar una rutina
      responses: {'204': {description: Eliminada}, '404': {description: No existe}}
  /plans/{planId}/routines/{routineId}/exercises:
    parameters: [{$ref: '#/components/parameters/planId'}, {$ref: '#/components/parameters/routineId'}]
    post:
      summary: Agregar un ejercicio
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Exercise'}}}}
      responses: {'201': {description: Creado}, '404': {description: No existe}}
    get:
      summary: Listar ejercicios
      responses: {'200': {description: Lista}, '404': {description: No existe}}
  /plans/{planId}/routines/{routineId}/exercises/{exerciseId}:
    parameters: [{$ref: '#/components/parameters/planId'}, {$ref: '#/components/parameters/routineId'}, {$ref: '#/components/parameters/exerciseId'}]
    patch:
      summary: Actualizar un ejercicio
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Exercise'}}}}
      responses: {'200': {description: Ejercicio}, '404': {description: No existe}}
    delete:
      summary: Eliminar un ejercicio
      responses: {'204': {description: Eliminado}, '404': {description: No existe}}
  /sessions:
    post:
      summary: Registrar una sesión
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Session'}}}}
      responses: {'201': {description: Creada}, '400': {description: Datos no válidos}}
    get:
      summary: Listar sesiones
      parameters:
        - {name: limit, in: query, schema: {type: integer, maximum: 100}, example: 20}
      responses: {'200': {description: Lista}}
  /sessions/{sessionId}:
    parameters: [{$ref: '#/components/parameters/sessionId'}]
    get:
      summary: Ver una sesión
      responses: {'200': {description: Sesión}, '404': {description: No existe}}
