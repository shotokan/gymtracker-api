# ==============================================================================
# Deploy workflow
#
# Triggers on every push to main after CI passes.
# Compiles Go binaries and deploys the CDK stack to AWS.
#
# Authentication: GitHub OIDC (no long-lived AWS credentials stored as secrets).
# ==============================================================================

name: Deploy

on:
    push:
        branches:
            - main

# Prevent concurrent deploys to avoid race conditions on the same stack.
# A new push to main will wait for the current deploy to finish.
concurrency:
    group: deploy-production
    cancel-in-progress: false

env:
    AWS_REGION: us-east-1
    NODE_VERSION: "20"

jobs:
    # ── Run tests before deploying ─────────────────────────────────────────────
    test:
        name: Test
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version-file: go.mod
                  cache: true

            - name: Download Go modules
              run: go mod download

            - name: Run linter
              uses: golangci/golangci-lint-action@v9
              with:
                  version: latest

            - name: Run unit tests
              run: go test ./... -race -count=1 -coverprofile=coverage.out

            - name: Print coverage summary
              run: go tool cover -func=coverage.out | tail -1

    # ── Deploy to AWS ──────────────────────────────────────────────────────────
    deploy:
        name: Deploy to AWS
        runs-on: ubuntu-latest
        needs: test # only deploy if tests pass

        # Required for GitHub OIDC token (no AWS Access Keys needed)
        permissions:
            id-token: write
            contents: read

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version-file: go.mod
                  cache: true

            - name: Set up Node.js ${{ env.NODE_VERSION }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
                  cache-dependency-path: infra/package-lock.json

            - name: Configure AWS credentials via OIDC
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  # IAM Role ARN stored as a GitHub repository secret.
                  # The role must trust GitHub's OIDC provider and have permissions to:
                  # CloudFormation, Lambda, DynamoDB, API Gateway, SSM, IAM, S3, ECR
                  role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
                  aws-region: ${{ env.AWS_REGION }}

            - name: Verify AWS identity
              run: aws sts get-caller-identity

            - name: Compile Lambda binaries
              # CDK packages the binaries from bin/ (see goCode in infra/lib/constructs/lambdas.ts)
              run: make build

            - name: Install CDK dependencies
              run: cd infra && npm ci

            - name: Show infrastructure diff
              # Non-blocking: shows what will change but does not fail the job
              run: cd infra && npx cdk diff GymTrackerStack || true

            - name: Deploy stack
              run: |
                  cd infra && npx cdk deploy GymTrackerStack \
                    --require-approval never \
                    --region ${{ env.AWS_REGION }}

            - name: Print API URL
              # Extract and display the deployed API Gateway URL from CloudFormation outputs
              run: |
                  API_URL=$(aws cloudformation describe-stacks \
                    --stack-name GymTrackerStack \
                    --region ${{ env.AWS_REGION }} \
                    --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
                    --output text)
                  echo "✓ API deployed at: $API_URL"
                  echo "API_URL=$API_URL" >> $GITHUB_STEP_SUMMARY
