apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gymtracker-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gymtracker-api
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
    scaleDown:
      # Give back idle capacity quickly, without flapping on a short pause in traffic.
      stabilizationWindowSeconds: 120
