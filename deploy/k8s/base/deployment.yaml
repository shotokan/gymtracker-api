apiVersion: apps/v1
kind: Deployment
metadata:
  name: gymtracker-api
  labels:
    app.kubernetes.io/name: gymtracker-api
spec:
  # No replicas field on purpose: the HPA owns it, and re-applying must not reset it.
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: gymtracker-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gymtracker-api
    spec:
      serviceAccountName: gymtracker-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: gymtracker-api:latest
          ports:
            - name: http
              containerPort: 8080
            - name: admin
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: gymtracker-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: gymtracker-secrets
                  key: jwt-secret
          # Requests size the bill and the HPA target, so they stay close to real use.
          resources:
            requests:
              cpu: 100m
              memory: 48Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /healthz
              port: admin
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: admin
            periodSeconds: 5
            timeoutSeconds: 3
