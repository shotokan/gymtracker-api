# EKS as defined in terraform/environments/aws. Validated in CI but never deployed:
# set the image and the role ARN from the Terraform outputs before using it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gymtracker
resources:
  - ../../base
components:
  - ../../components/finops
images:
  - name: gymtracker-api
    newName: ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/gymtracker-api
    newTag: latest
patches:
  - target:
      kind: ServiceAccount
      name: gymtracker-api
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/gymtracker-test-api
  - target:
      kind: ServiceAccount
      name: gymtracker-api
    patch: |-
      - op: replace
        path: /automountServiceAccountToken
        value: true
  - target:
      kind: Deployment
      name: gymtracker-api
    patch: |-
      - op: replace
        path: /spec/template/spec/automountServiceAccountToken
        value: true
  - target:
      kind: ConfigMap
      name: gymtracker-config
    patch: |-
      - op: replace
        path: /data/DYNAMO_TABLE
        value: gymtracker-test
