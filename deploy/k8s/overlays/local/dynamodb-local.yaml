apiVersion: v1
kind: ConfigMap
metadata:
  name: gymtracker-local-config
data:
  AWS_REGION: us-east-1
  DYNAMO_ENDPOINT: http://dynamodb-local:8000
  # DynamoDB Local requires credentials but does not check them.
  AWS_ACCESS_KEY_ID: local
  AWS_SECRET_ACCESS_KEY: local
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dynamodb-local
  labels:
    app.kubernetes.io/name: dynamodb-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dynamodb-local
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dynamodb-local
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dynamodb
          image: amazon/dynamodb-local:3.3.2
          # Data lives in memory and disappears with the pod: this is a test database.
          args: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
          ports:
            - name: dynamodb
              containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: dynamodb-local
spec:
  selector:
    app.kubernetes.io/name: dynamodb-local
  ports:
    - name: dynamodb
      port: 8000
      targetPort: dynamodb
