# The Grafana sidecar loads any ConfigMap with this label from the monitoring namespace.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
configMapGenerator:
  - name: gymtracker-dashboard
    files:
      - gymtracker.json=dashboard.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
